# FloppyURL — Deploy do bootloader no GitHub Pages
# O kernel WASM é compilado no pipeline; nenhum binário fica no Git.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compilar kernel WASM
        run: |
          GOOS=js GOARCH=wasm go build -o Website/wasm.wasm ./cmd/wasmdecoder
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" Website/wasm_exec.js

      - name: Preparar site
        run: |
          mkdir -p site
          cp -r Website/. site/
          cp examples/demo.html site/demo-source.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
