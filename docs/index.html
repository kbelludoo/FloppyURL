<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketWeb - Buscador e Navegador para Áreas Remotas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Invalidação imediata de caches de versões anteriores
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-border: #dfe1e5;
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --accent: #1e8e3e;
      --text: #202124;
      --text-muted: #5f6368;
      --link: #1a0dab;
      --shadow: 0 1px 6px rgba(32,33,36,.28);
    }

    [data-theme="dark"] {
      --bg: #12151a;
      --surface: #1e232b;
      --surface-border: #3c4043;
      --primary: #8ab4f8;
      --primary-hover: #aecbfa;
      --accent: #81c995;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --link: #8ab4f8;
      --shadow: 0 1px 8px rgba(0,0,0,.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    /* BARRA SUPERIOR DISCRETA */
    header {
      padding: 14px 24px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(30, 142, 62, 0.12);
      color: var(--accent);
      border: 1px solid rgba(30, 142, 62, 0.3);
      font-weight: 600;
      font-size: 12px;
    }

    .status-badge.offline {
      background: rgba(26, 115, 232, 0.12);
      color: var(--primary);
      border-color: rgba(26, 115, 232, 0.3);
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .btn-icon:hover {
      background: var(--surface);
    }

    /* CONTAINER PRINCIPAL ESTILO GOOGLE */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .home-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 6vh;
      margin-bottom: 26px;
      text-align: center;
    }

    .brand-logo {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 2px;
      user-select: none;
    }

    .brand-logo .l-blue { color: #4285f4; }
    .brand-logo .l-red { color: #ea4335; }
    .brand-logo .l-yellow { color: #fbbc05; }
    .brand-logo .l-green { color: #34a853; }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* BARRA DE PESQUISA GOOGLE */
    .search-box-wrapper {
      width: 100%;
      max-width: 620px;
      position: relative;
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--surface-border);
      border-radius: 28px;
      padding: 10px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .search-box:focus-within {
      box-shadow: var(--shadow);
      border-color: transparent;
    }

    .search-icon {
      color: var(--text-muted);
      margin-right: 12px;
      font-size: 16px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
    }

    .search-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    /* BOTÕES ESTILO GOOGLE */
    .search-buttons {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-google {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .btn-google:hover {
      border-color: #dadce0;
      background-color: var(--surface-border);
    }

    /* CHIPS DE ATALHOS RÁPIDOS */
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
      max-width: 650px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .chip:hover {
      background: var(--surface-border);
    }

    /* ÁREA DE RESULTADOS DE BUSCA */
    #results-area {
      width: 100%;
      max-width: 700px;
      margin-top: 24px;
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .results-count {
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .result-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-url {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--link);
      cursor: pointer;
      text-decoration: none;
      line-height: 1.3;
    }
    .result-title:hover {
      text-decoration: underline;
    }

    .result-snippet {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 2px;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-pack-open {
      background: var(--primary);
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-pack-open:hover {
      background: var(--primary-hover);
    }

    /* VISUALIZADOR HUD */
    #viewer-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      z-index: 1000;
      flex-direction: column;
    }

    #viewer-hud {
      background: #111827;
      color: white;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 1px solid #374151;
      gap: 10px;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .savings-badge {
      background: #065f46;
      color: #34d399;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    #content-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: white;
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--primary);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      display: none;
      z-index: 3000;
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header>
    <div id="net-status" class="status-badge">
      <span style="font-size: 8px;">●</span> Online
    </div>
    <button class="btn-icon" id="btn-library" title="Minha Biblioteca Offline (Páginas Salvas)">💾</button>

  </header>

  <!-- CONTAINER CENTRAL ESTILO GOOGLE -->
  <main id="main-content">
    
    <div class="home-hero" id="home-hero">
      <div class="brand-logo">
        <span class="l-blue">P</span><span class="l-red">o</span><span class="l-yellow">c</span><span class="l-blue">k</span><span class="l-green">e</span><span class="l-red">t</span><span style="font-weight: 300; margin-left: 2px;">Web</span>

    <!-- LISTA DE RESULTADOS DE BUSCA -->

  </main>

  <!-- VISUALIZADOR HUD DE PÁGINA COMPACTADA -->
  <div id="viewer-container">
    <div id="viewer-hud">
      <div class="hud-group">
        <button class="btn-google" id="btn-viewer-back" style="padding: 4px 10px; font-size: 12px;">⬅ Voltar à Busca</button>
        <span id="viewer-title" style="font-weight: 600; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Carregando página...</span>
      </div>
      <div class="hud-group">
        <span id="viewer-savings" class="savings-badge">Economia: --%</span>
        <button class="btn-google" id="btn-viewer-save" style="padding: 4px 12px; font-size: 12px; background: #1a73e8; color: white; border: none;">💾 Salvar Offline</button>
        <button class="btn-google" id="btn-viewer-share" style="padding: 4px 10px; font-size: 12px;">📤 Compartilhar</button>

    <iframe id="content-frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>
  </div>

  <!-- TOAST FEEDBACK -->
  <div id="toast"></div>

  <!-- SUPORTE A WASM (BROTLI) -->
  <script src="wasm_exec.js"></script>

  <!-- MOTOR POCKETWEB -->
  <script>
    'use strict';

    // REGISTRO DE SERVICE WORKER PARA RESILIÊNCIA TOTAL
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // CONFIGURAÇÃO DO SERVIDOR CLOUD PACKAGER / SEARCH
    const DEFAULT_SERVER = 'https://controls-louisville-joe-legitimate.trycloudflare.com';
    let serverUrl = localStorage.getItem('pocketweb_server') || DEFAULT_SERVER;

    // MONITOR DE CONEXÃO
    function updateNetStatus() {
      const badge = document.getElementById('net-status');
      if (navigator.onLine) {
        badge.className = 'status-badge';
        badge.innerHTML = '<span style="font-size: 8px;">●</span> Online';
      } else {
        badge.className = 'status-badge offline';
        badge.innerHTML = '<span style="font-size: 8px;">●</span> Modo Offline (Memória)';
      }
    }
    window.addEventListener('online', updateNetStatus);
    window.addEventListener('offline', updateNetStatus);
    updateNetStatus();

    // TEMA (SOLAR / ESCURO)
    const btnTheme = document.getElementById('btn-theme');
    let currentTheme = localStorage.getItem('pocketweb_theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    btnTheme.onclick = () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('pocketweb_theme', currentTheme);
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    // --- CARREGADOR WASM BROTLI ---
    let wasmPronto = false;
    async function bootWasm() {
      if (wasmPronto) return true;
      try {
        const go = new Go();
        const resp = await fetch("wasm.wasm?v=" + Date.now());
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const wasmBytes = await resp.arrayBuffer();
        const result = await WebAssembly.instantiate(wasmBytes, go.importObject);
        go.run(result.instance);
        wasmPronto = true;
        return true;
      } catch (e) { return false; }
    }

    // --- INDEXEDDB MEMÓRIA LOCAL ---
    let db;
    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('PocketWebDB', 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('articles')) {
            d.createObjectStore('articles', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = () => resolve(null);
      });
    }

    function saveToDB(article) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        const tx = db.transaction('articles', 'readwrite');
        tx.objectStore('articles').put(article);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }

    function getAllFromDB() {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        const tx = db.transaction('articles', 'readonly');
        const req = tx.objectStore('articles').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    // --- NATIVE DECOMPRESSION (0 BYTES) ---
    function base64UrlToUint8Array(base64Url) {
      let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) base64 += '=';
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function decompressNative(compressedBytes, format) {
      const ds = new DecompressionStream(format);
      const writer = ds.writable.getWriter();
      writer.write(compressedBytes);
      writer.close();
      const response = new Response(ds.readable);
      return await response.text();
    }

    // --- VISUALIZADOR HUD ---
    let currentArticle = null;

    function abrirViewer(title, html, rawSize, compSize, hash) {
      currentArticle = { title, html, rawSize, compSize, hash };
      const viewer = document.getElementById('viewer-container');
      const titleEl = document.getElementById('viewer-title');
      const savingsEl = document.getElementById('viewer-savings');
      const frame = document.getElementById('content-frame');

      titleEl.innerText = title;
      const pct = rawSize > 0 ? Math.round(((rawSize - compSize) / rawSize) * 100) : 0;
      savingsEl.innerText = `Economia: ${pct > 0 ? pct : 0}% (${(compSize/1024).toFixed(1)} KB vs ${(rawSize/1024).toFixed(1)} KB)`;

      frame.srcdoc = html;
      viewer.style.display = 'flex';
    }

    function fecharViewer() {
      document.getElementById('viewer-container').style.display = 'none';
      document.getElementById('content-frame').srcdoc = '';
      currentArticle = null;
      if (window.location.hash) history.pushState("", document.title, window.location.pathname);
    }

    document.getElementById('btn-viewer-back').onclick = fecharViewer;

    document.getElementById('btn-viewer-save').onclick = async () => {
      if (!currentArticle) return;
      const id = 'art_' + Date.now();
      await saveToDB({
        id: id,
        title: currentArticle.title || 'Página Web',
        html: currentArticle.html,
        rawSize: currentArticle.rawSize,
        compSize: currentArticle.compSize,
        hash: currentArticle.hash,
        savedAt: Date.now()
      });
      showToast('✅ Salvo na Memória Offline com sucesso!');
    };

    document.getElementById('btn-viewer-share').onclick = () => {
      if (!currentArticle) return;
      const fullUrl = window.location.origin + window.location.pathname + currentArticle.hash;
      if (navigator.share) {
        navigator.share({ title: currentArticle.title, url: fullUrl }).catch(() => {});
      } else {
        navigator.clipboard.writeText(fullUrl).then(() => showToast('Link copiado!'));
      }
    };

    // --- ABRIR SITE COMPACTADO REMOTO ---
    async function abrirSiteRemoto(targetUrl) {
      showToast('⚡ Compactando site remoto a 1Gbps...');
      try {
        const endpoint = `${serverUrl}/pack?url=${encodeURIComponent(targetUrl)}`;
        const resp = await fetch(endpoint);
        if (!resp.ok) throw new Error("Servidor não respondeu");
        const data = await resp.json();

        if (data.boot_url) {
          const hash = data.boot_url.includes('#') ? data.boot_url.split('#')[1] : data.boot_url;
          window.location.hash = hash;
          await processarPayload(hash);
        }
      } catch (err) {
        alert("Erro ao abrir site: " + err.message + "\nVerifique se o servidor Colab está ativo.");
      }
    }

    // --- DESCOMPRESSÃO DE PAYLOAD #v2;... ---
    async function processarPayload(hashStr) {
      if (hashStr.startsWith('#')) hashStr = hashStr.substring(1);
      hashStr = hashStr.trim();
      if (!hashStr) return;

      let algo = "deflate";
      let payloadBruto = "";

      const matchV2 = hashStr.match(/^v2;([a-z0-9_-]+);\[(\d+)\/(\d+)\];([a-f0-9]{64});([a-f0-9]{64});(.*)$/);
      if (matchV2) {
        algo = matchV2[1];
        payloadBruto = matchV2[6];
      } else if (hashStr.startsWith("v2;")) {
        const parts = hashStr.split(";");
        algo = parts[1] || "deflate";
        payloadBruto = parts.slice(5).join(";");
      } else {
        payloadBruto = hashStr;
      }

      showToast(`⚡ Descompactando via motor ${algo.toUpperCase()}...`);

      try {
        let htmlPuro = "";
        if (algo === "deflate" || algo === "deflate-raw") {
          const binaryBytes = base64UrlToUint8Array(payloadBruto);
          htmlPuro = await decompressNative(binaryBytes, "deflate-raw");
        } else if (algo === "gzip") {
          const binaryBytes = base64UrlToUint8Array(payloadBruto);
          htmlPuro = await decompressNative(binaryBytes, "gzip");
        } else if (algo === "brotli") {
          if (!wasmPronto) await bootWasm();
          htmlPuro = window.decoder(payloadBruto);
          if (htmlPuro.startsWith("Error")) throw new Error(htmlPuro);
        }

        let docTitle = "Página Web Descompactada";
        const titleMatch = htmlPuro.match(/<title>([^<]+)<\/title>/i);
        if (titleMatch) docTitle = titleMatch[1];

        const rawSize = new TextEncoder().encode(htmlPuro).length;
        const compSize = payloadBruto.length;

        abrirViewer(docTitle, htmlPuro, rawSize, compSize, '#' + hashStr);

      } catch (err) {
        alert("Erro na descompressão: " + err.message);
      }
    }

    // --- MOTOR DE PESQUISA POCKETWEB (ESTILO GOOGLE) ---
    async function executarBusca(query) {
      query = query.trim();
      if (!query) return;

      // Se for URL direta, abre imediatamente
      if (/^https?:\/\//i.test(query) || (!query.includes(' ') && query.includes('.'))) {
        let url = query;
        if (!url.startsWith('http')) url = 'https://' + url;
        await abrirSiteRemoto(url);
        return;
      }

      // Se for payload #v2;...
      if (query.startsWith('#v2;') || query.startsWith('v2;')) {
        await processarPayload(query);
        return;
      }

      const resultsArea = document.getElementById('results-area');
      const resultsList = document.getElementById('results-list');
      const resultsCount = document.getElementById('results-count');
      const hero = document.getElementById('home-hero');

      // Animação para modo busca
      hero.style.marginTop = "2vh";
      hero.style.marginBottom = "14px";
      resultsArea.style.display = "flex";
      resultsList.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);"><span class="spinner" style="border-top-color:var(--primary);"></span> Pesquisando na web em alta velocidade...</div>';

      try {
        let items = [];

        // 1. Busca primeiro na biblioteca local offline (IndexedDB)
        try {
          const localArticles = await getAllFromDB();
          const qLower = query.toLowerCase();
          const localMatches = localArticles.filter(a =>
            (a.title && a.title.toLowerCase().includes(qLower)) ||
            (a.html && a.html.toLowerCase().includes(qLower))
          );
          localMatches.forEach(m => {
            items.push({
              title: `💾 [Salvo no Aparelho] ${m.title}`,
              snippet: `Página disponível 100% offline. Salva em ${new Date(m.savedAt).toLocaleDateString('pt-BR')}`,
              url: m.hash,
              isLocal: true,
              localId: m.id
            });
          });
        } catch(e) {}

        // 2. Tenta buscar no Colab Search Server (se túnel estiver online com /search)
        try {
          const resp = await fetch(`${serverUrl}/search?q=${encodeURIComponent(query)}`);
          if (resp.ok) {
            const serverItems = await resp.json();
            if (Array.isArray(serverItems) && serverItems.length > 0) {
              items = items.concat(serverItems);
            }
          }
        } catch (e) {}

        // 3. Fallback Full-Text Search público global (Wikipédia Full-Text API)
        if (items.length <= 1) {
          try {
            const wikiResp = await fetch(`https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`);
            if (wikiResp.ok) {
              const wikiData = await wikiResp.json();
              const hits = (wikiData.query && wikiData.query.search) || [];
              const cleanTags = (s) => s ? s.replace(/<[^>]*>/g, '').replace(/&quot;/g, '"').replace(/&amp;/g, '&') : '';
              hits.forEach(h => {
                items.push({
                  title: h.title,
                  snippet: cleanTags(h.snippet) + '...',
                  url: `https://pt.wikipedia.org/wiki/${encodeURIComponent(h.title)}`
                });
              });
            }
          } catch(e) {}
        }

        if (items.length === 0) {
          resultsList.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">Nenhum resultado encontrado. Tente outras palavras ou digite a URL direta do site (ex: <code>g1.globo.com</code>).</div>';
          return;
        }

        resultsCount.innerText = `Aproximadamente ${items.length} resultados encontrados para "${query}"`;
        resultsList.innerHTML = '';

        items.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'result-card';
          const clickAction = item.isLocal ? `openSaved('${item.localId}')` : `abrirSiteRemoto('${item.url}')`;
          const btnLabel = item.isLocal ? '📖 Abrir da Memória (Offline)' : '⚡ Abrir no PocketWeb (Leve)';
          card.innerHTML = `
            <div class="result-url">${item.isLocal ? '💾 Armazenamento Local' : '🌐 ' + item.url}</div>
            <a class="result-title" href="javascript:void(0)" onclick="${clickAction}">${item.title}</a>
            <div class="result-snippet">${item.snippet || ''}</div>
            <div class="result-actions">
              <button class="btn-pack-open" onclick="${clickAction}">${btnLabel}</button>
            </div>
          `;
          resultsList.appendChild(card);
        });

      } catch (err) {
        resultsList.innerHTML = `<div style="color:red; padding:20px;">Falha na busca: ${err.message}</div>`;
      }
    }

    // EVENTOS DE ENTRADA
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');

    searchInput.addEventListener('input', () => {
      searchClear.style.display = searchInput.value ? 'block' : 'none';
    });

    searchClear.onclick = () => {
      searchInput.value = '';
      searchClear.style.display = 'none';
      searchInput.focus();
    };

    document.getElementById('btn-search').onclick = () => executarBusca(searchInput.value);
    document.getElementById('btn-direct').onclick = () => {
      let val = searchInput.value.trim();
      if (!val) return;
      if (!val.startsWith('http') && val.includes('.')) val = 'https://' + val;
      if (val.startsWith('http')) abrirSiteRemoto(val);
      else executarBusca(val);
    };

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executarBusca(searchInput.value);
    });

    function quickSearch(term) {
      searchInput.value = term;
      searchClear.style.display = 'block';
      executarBusca(term);
    }

    // MODAL DE BIBLIOTECA OFFLINE
    async function openLibraryModal() {
      const articles = await getAllFromDB();
      const resultsArea = document.getElementById('results-area');
      const resultsList = document.getElementById('results-list');
      const resultsCount = document.getElementById('results-count');

      resultsArea.style.display = "flex";
      resultsCount.innerText = `Minha Biblioteca Offline (${articles.length} páginas salvas)`;
      resultsList.innerHTML = '';

      if (articles.length === 0) {
        resultsList.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">Nenhuma página salva ainda. Abra qualquer site ou guia de emergência e clique em "Salvar Offline".</div>';
        return;
      }

      articles.sort((a,b) => b.savedAt - a.savedAt).forEach((art) => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-url">💾 Salvo em ${new Date(art.savedAt).toLocaleDateString('pt-BR')} • ${(art.compSize/1024).toFixed(1)} KB</div>
          <a class="result-title" href="javascript:void(0)" onclick="openSaved('${art.id}')">${art.title}</a>
          <div class="result-actions">
            <button class="btn-pack-open" onclick="openSaved('${art.id}')">Ler Agora (100% Offline)</button>
          </div>
        `;
        resultsList.appendChild(card);
      });
    }

    document.getElementById('btn-library').onclick = openLibraryModal;

    async function openSaved(id) {
      const articles = await getAllFromDB();
      const art = articles.find(a => a.id === id);
      if (art) abrirViewer(art.title, art.html, art.rawSize, art.compSize, art.hash);
    }

    // MANUAIS DE EMERGÊNCIA
    const SAMPLE_DOCS = {
      water: `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Purificação de Água em Campo</title><style>body{font-family:sans-serif;line-height:1.6;padding:20px;max-width:700px;margin:auto;}h1{color:#1a73e8;}h2{color:#1557b0;margin-top:16px;}ul,ol{padding-left:20px;}</style></head><body><h1>💧 Purificação de Água em Emergências</h1><h2>1. Fervura</h2><ol><li>Filtre sedimentos visíveis com pano limpo.</li><li>Ferva vigorosamente por 1 minuto inteiro (ou 3 min acima de 2000m).</li></ol><h2>2. Cloração</h2><ul><li>2 gotas de água sanitária (sem cheiro) por litro.</li><li>Aguarde 30 minutos antes de beber.</li></ul></body></html>`,
      firstaid: `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Primeiros Socorros & Hemorragias</title><style>body{font-family:sans-serif;line-height:1.6;padding:20px;max-width:700px;margin:auto;}h1{color:#d93025;}h2{color:#b31412;margin-top:16px;}ul,ol{padding-left:20px;}</style></head><body><h1>🩹 Primeiros Socorros em Áreas Isoladas</h1><h2>1. Controle de Sangramento</h2><ol><li>Pressione firmemente com pano limpo sobre o corte sem interromper por 5 minutos.</li><li>Para ferimentos arteriais graves em membros, use torniquete 5cm acima do corte.</li></ol><h2>2. Prevenção de Choque</h2><ul><li>Eleve as pernas da vítima 30cm e mantenha-a aquecida.</li></ul></body></html>`,
      morse: `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Código Morse & Sinais SOS</title><style>body{font-family:sans-serif;line-height:1.6;padding:20px;max-width:700px;margin:auto;}h1{color:#188038;}.sos{font-size:1.8rem;color:#d93025;font-weight:bold;text-align:center;padding:12px;background:#fce8e6;border-radius:8px;margin:16px 0;}</style></head><body><h1>📡 Código Morse & Sinais SOS</h1><div class="sos">··· ─── ··· (S - O - S)</div><p>3 sinais curtos, 3 longos, 3 curtos. Pause 3 segundos e repita com apito, lanterna ou espelho.</p></body></html>`
    };

    async function loadSample(key) {
      const html = SAMPLE_DOCS[key];
      if (!html) return;
      const titles = {
        water: 'Guia de Purificação de Água em Campo',
        firstaid: 'Manual de Primeiros Socorros & Hemorragias',
        morse: 'Tabela de Código Morse & Sinais SOS'
      };
      abrirViewer(titles[key], html, html.length, Math.round(html.length * 0.3), '#sample_' + key);
    }

    // BOOT INICIAL
    window.onload = async () => {
      await initDB();
      const hashAtual = window.location.hash;
      if (hashAtual.length > 1) {
        processarPayload(hashAtual);
      }
    };
  </script>
</body>
</html>
