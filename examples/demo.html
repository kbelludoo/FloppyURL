<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloppyURL Attested WebApp</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            color: #38bdf8;
        }
        p {
            line-height: 1.6;
            color: #9ca3af;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }
        button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }
        #counter {
            font-size: 2rem;
            font-weight: 800;
            color: #38bdf8;
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Zero-Byte Serverless</span>
        <h1>FloppyURL v2.0 Operacional</h1>
        <p>Esta aplicação foi descompactada e executada diretamente a partir do fragmento da URL via <strong>FloppyURL</strong> com integridade atestada por <strong>SHA-256</strong>.</p>
        <div id="counter">0</div>
        <button id="btn">Incrementar Contador Interativo</button>
    </div>

    <script>
        let count = 0;
        const btn = document.getElementById('btn');
        const counter = document.getElementById('counter');
        btn.addEventListener('click', () => {
            count++;
            counter.innerText = count;
        });
    </script>
</body>
</html>
