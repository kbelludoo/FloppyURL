[package]
name = "floppy-core"
version = "0.1.0"
edition = "2021"
authors = ["FloppyURL Core Team"]
description = "High-performance Rust engine for FloppyURL (RTK Token Compressor + PocketWeb Packager)"

[lib]
name = "floppy_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "floppy-core"
path = "src/main.rs"

[dependencies]
minify-html = "0.15"
flate2 = { version = "1.0", features = ["rust_backend"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
